[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "axl-lang"
version = "2.0.0.dev0"
description = "Compact general-purpose language and reference runtime for agents"
requires-python = ">=3.11"
license = "Apache-2.0"

[project.scripts]
axl = "axl.__main__:main"

[tool.setuptools]
packages = ["axl"]

[tool.setuptools.data-files]
"share/axl/schema" = ["schema/axl-ir-1.0.schema.json", "schema/axl-ir-1.1.schema.json", "schema/axl-ir-1.2.schema.json"]
