[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "axl-lang"
version = "1.1.0.dev0"
description = "Agent eXecution Language reference interpreter"
requires-python = ">=3.11"
license = "Apache-2.0"

[project.scripts]
axl = "axl.__main__:main"

[tool.setuptools]
packages = ["axl"]

[tool.setuptools.data-files]
"share/axl/schema" = ["schema/axl-ir-1.0.schema.json", "schema/axl-ir-1.1.schema.json"]
