name: Docs GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "presentation.html"
      - "mondo.html"
      - "film.html"
      - "SPEC-4.0.md"
      - "index.html"
      - ".nojekyll"
      - ".github/workflows/docs-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Deploy the whole repo so docs can fetch ../presentation.html, SPEC-4.0.md, etc.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
