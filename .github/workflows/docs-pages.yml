name: Docs GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "presentation.html"
      - "mondo.html"
      - "film.html"
      - "SPEC-4.0.md"
      - "hosts/portal-web/README.md"
      - "examples/apps/README.md"
      - "scripts/prepare-docs-site.sh"
      - "scripts/serve-docs.sh"
      - ".github/workflows/docs-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare self-contained docs site
        run: sh scripts/prepare-docs-site.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
